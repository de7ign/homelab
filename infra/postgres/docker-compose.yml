version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: t7xIdWSYRDBs
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:

networks:
  proxy:
    external: true