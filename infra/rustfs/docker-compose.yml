services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://rustfs-console.local
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    restart: unless-stopped
    volumes:
      - rustfs_data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # S3 API
      - "traefik.http.routers.rustfs.rule=Host(`rustfs.local`)"
      - "traefik.http.routers.rustfs.service=rustfs"
      - "traefik.http.services.rustfs.loadbalancer.server.port=9000"

      # Console UI
      - "traefik.http.routers.rustfs-console.rule=Host(`rustfs-console.local`)"
      - "traefik.http.routers.rustfs-console.service=rustfs-console"
      - "traefik.http.services.rustfs-console.loadbalancer.server.port=9001"

  rustfs-volume-permissions:
    image: alpine:latest
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    restart: "no"
    volumes:
      - rustfs_data:/data

volumes:
  rustfs_data:

networks:
  proxy:
    external: true
